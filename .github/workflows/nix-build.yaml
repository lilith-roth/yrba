name: "Nix"

permissions:
  contents: "write"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  Build:
    runs-on: "ubuntu-latest"

    steps:
      - name: "GitHub: Checkout Repository"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" #v6.0.1

      - name: "GitHub: Setup Nix"
        uses: "custom-workflows/setup-nix@d3dc49dd7bd37d10de81c938bebefad918e4d499"
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: "Nix: Check Formatting"
        run: |
          nix run nixpkgs#just format-check-nix

      - name: "Nix: Check Lint"
        run: |
          nix run nixpkgs#just lint-nix

      - name: "Nix: Build"
        run: |
          nix run nixpkgs#just build-nix
