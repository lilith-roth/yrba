[global]
        server string = samba
        idmap config * : range = 3000-7999
        security = user
        server min protocol = SMB2
        guest account = guest
        map to guest = Bad User
        usershare allow guests = yes

        # disable printing services
        load printers = no
        printing = bsd
        printcap name = /dev/null
        disable spoolss = yes

[content]
        path = /storage
        comment = Shared
        valid users =
        invalid users =
        guest ok = yes
        browsable = yes
        writable = yes
        read only = no
        force user = root
        force group = root
        public = yes
