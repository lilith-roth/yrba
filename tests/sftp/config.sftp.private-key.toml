# Remote address for uploading backups
remote = 'sftp://testuser@127.0.0.1:2222/tmp/yrba-test-sftp-private-key/out/'

sftp_public_key_path = '/tmp/yrba-test-sftp-private-key/id_ed25519.pub'
sftp_private_key_path = '/tmp/yrba-test-sftp-private-key/id_ed25519'

# The amount of backups to keep
# Set to 0 to never delete old backups
amount_of_backups_to_keep = 5

# Path to folders to back up, supports relative paths
folders_to_backup = [
    '/tmp/yrba-test-sftp-private-key/backup-content'
]

# Optional: Temporary folder to store archive before upload
# Default: '~/.cache/yrba'
temporary_folder = '/tmp/yrba-test-sftp-private-key/tmp'
